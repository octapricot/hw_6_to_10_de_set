services:

  cassandra:
    image: cassandra:4.1
    container_name: hw7_cassandra
    ports:
      - "9043:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=hw7_cluster
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - hw7_network

  redis:
    image: redis:7.2
    container_name: hw7_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - hw7_network

  api:
    build: ./api
    container_name: hw7_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CASSANDRA_HOST: cassandra
      REDIS_HOST: redis
    depends_on:
      cassandra:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - hw7_network

volumes:
  cassandra_data:
  redis_data:

networks:
  hw7_network:
    driver: bridge